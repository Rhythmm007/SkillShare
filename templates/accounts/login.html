{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5 col-xl-4">
    <div class="card p-4">
      <h1 class="h3 mb-1">Welcome back</h1>
      <p class="text-secondary">Log in to continue learning.</p>
      <form method="post">
        {% csrf_token %}
        {% include "shared/_form_fields.html" with form=form %}
        <button type="submit" class="btn btn-dark w-100">Log in</button>
      </form>
      <p class="text-center small mt-3 mb-0">New here? <a href="{% url 'register' %}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
